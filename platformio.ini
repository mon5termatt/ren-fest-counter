; Ren Fest Counter — ESP32-WROOM-32 / Seeed XIAO ESP32C3
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
  majicdesigns/MD_MAX72XX @ ^3.5.1
  majicdesigns/MD_Parola @ ^3.7.1
  bblanchon/ArduinoJson @ ^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0

; Seeed Studio XIAO ESP32C3 (USB CDC serial)
[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
  majicdesigns/MD_MAX72XX @ ^3.5.1
  majicdesigns/MD_Parola @ ^3.7.1
  bblanchon/ArduinoJson @ ^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; HTTP push OTA: SoftAP (192.168.4.1) or LAN via OTA_HTTP_URL / mDNS.
; Example: set OTA_HTTP_URL=http://10.0.0.92/update
[env:ota]
extends = env:esp32dev
upload_protocol = custom
extra_scripts = pre:ota_host_ip.py
upload_command = python ota_http_upload.py $SOURCE

[env:ota_xiao]
extends = env:seeed_xiao_esp32c3
upload_protocol = custom
extra_scripts = pre:ota_host_ip.py
upload_command = python ota_http_upload.py $SOURCE
